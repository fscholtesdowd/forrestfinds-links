<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forrest Finds Poster: connected</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#26301f;background:#f4f6ef}@media (prefers-color-scheme: dark){body{color:#e8ecdf;background:#161a12}}code{font-size:1.1rem;word-break:break-all}</style>
</head><body><h1>TikTok said yes</h1>
<p id="msg">Reading the answer from TikTok...</p>
<p><code id="code"></code></p>
<script>
var q=new URLSearchParams(location.search);
var c=q.get('code'),e=q.get('error');
document.getElementById('msg').textContent = e ? ('TikTok returned: '+e) : (c ? 'Copy the code below into the poster window on the computer. It works once and expires in a few minutes.' : 'No code here. Start the connect step from the poster again.');
if(c){document.getElementById('code').textContent=c;}
</script>
<p><a href="./">Back to Forrest Finds</a></p>
</body></html>
